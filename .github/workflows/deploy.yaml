name: Deploy to Server

on:
  push:
    branches:
      - deploy  # 'deploy' 브랜치에 push될 때 실행

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: ./gradlew build

      - name: Build Docker Image
        run: docker build -t myapp:latest .

      - name: Push Docker Image to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag myapp:latest mydockerhub/myapp:latest
          docker push mydockerhub/myapp:latest

      - name: Deploy to Server
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # MySQL 데이터베이스 실행
            docker run -d --name mysql-db \
              -e MYSQL_ROOT_PASSWORD=root1234 \
              -e MYSQL_DATABASE=testdb \
              -p 3306:3306 \
              mysql:8
            
            # 애플리케이션 실행
            docker pull mydockerhub/myapp:latest
            docker stop myapp || true
            docker rm myapp || true
            docker run -d --name myapp -p 8080:8080 \
              -e SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/testdb \
              -e SPRING_DATASOURCE_USERNAME=root \
              -e SPRING_DATASOURCE_PASSWORD=root1234 \
              mydockerhub/myapp:latest
